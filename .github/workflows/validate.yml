name: Validate Anima Studio 2D Narrated Drawing
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANIMA_STORAGE: /tmp/anima-studio-ci-jobs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core
      - name: Install Python dependencies
        run: pip install -r backend/requirements.txt
      - name: Compile Python
        run: python -m compileall -q backend
      - name: Compile Windows ComfyUI agent
        run: python -m py_compile tools/windows-gpu-agent/comfyui-agent.py
      - name: Validate dashboard JavaScript
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path("web/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>([\s\S]*?)</script>", html)
          if not scripts:
              raise SystemExit("Nenhum script do painel foi encontrado")
          Path("/tmp/anima-dashboard.js").write_text(scripts[-1], encoding="utf-8")
          PY
          node --check /tmp/anima-dashboard.js
          node --check web/inline-art.js
      - name: Check narrated 2D engine without GPU
        run: |
          python - <<'PY'
          from backend.app.engines.registry import selected_render_engine
          from backend.app import main
          assert selected_render_engine() == "2d"
          assert main.health()["gpu_required"] is False
          assert main.health()["blender_required"] is False
          print("Anima Studio 2D CPU narration and drawing ready")
          PY
      - name: Check portable media dependencies
        run: python -c "import edge_tts, imageio_ffmpeg, mutagen; print('Edge TTS, FFmpeg portátil e Mutagen disponíveis')"
      - name: Test narrated 2D production pipeline
        run: python -m unittest discover -s backend/tests -v
      - name: Validate Docker Compose
        run: docker compose -f docker-compose.yml config -q
      - name: Build Docker image
        run: docker build -t anima-cartoon3d:test .
