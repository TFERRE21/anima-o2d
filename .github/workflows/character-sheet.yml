name: Gerar prancha real dos personagens
on:
  push:
    branches: [main]
    paths:
      - "backend/app/cartoon2d.py"
      - "tools/render_character_sheet.py"
      - ".github/workflows/character-sheet.yml"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: character-sheet-main
  cancel-in-progress: false
jobs:
  render-character-sheet:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar Pillow
        run: python -m pip install --upgrade pip pillow
      - name: Renderizar arte com o motor Cartoon 2D
        run: python tools/render_character_sheet.py
      - name: Disponibilizar imagem para visualização nesta conversa
        uses: actions/upload-artifact@v4
        with:
          name: prancha-personagens-cartoon2d
          path: docs/images/character-sheet-cartoon2d.png
          retention-days: 7
      - name: Salvar imagem no GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/images/character-sheet-cartoon2d.png
          if git diff --cached --quiet; then
            echo "A prancha já está atualizada."
          else
            git commit -m "Add real Cartoon 2D character sheet"
            git push origin HEAD:main
          fi
