name: Validate Anima 2D Visual Engine
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  comic-renderer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PIL
        run: python -m pip install 'Pillow==11.2.1'
      - name: Check syntax
        run: python -m compileall -q backend/app
      - name: Test visuals and original music
        run: python -m unittest discover -s tests -p 'test_visual_engine.py' -v
