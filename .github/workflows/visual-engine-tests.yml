name: Validate Anima 2D Visual Engine
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  comic-renderer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install visual engine dependencies
        run: python -m pip install 'Pillow==11.2.1' 'httpx==0.28.1'
      - name: Check syntax
        run: python -m compileall -q backend/app
      - name: Test cast, worlds, backgrounds, caching and original music
        run: python -m unittest discover -s tests -p 'test_*engine.py' -v
      - name: Test spoken dialogue synchronization and Cloudflare configuration
        run: python -m unittest discover -s tests -p 'test_dialogue_timeline.py' -v
      - name: Test characters with fixed visual reference and proportional scenes
        run: python -m unittest discover -s tests -p 'test_character_reference_ai.py' -v
      - name: Test branded videos and automatic YouTube packaging
        run: python -m unittest discover -s tests -p 'test_channel_publication.py' -v
      - name: Test playable long episodes, silent-audio rejection and fullscreen layout
        run: python -m unittest discover -s tests -p 'test_video_integrity.py' -v
      - name: Test single-scene full-screen layout for Shorts and long episodes
        run: python -m unittest discover -s tests -p 'test_fullscreen_comic_layout.py' -v
      - name: Test new episode music, voice safety and dialogue clouds
        run: python -m unittest discover -s tests -p 'test_soundtrack_and_balloons.py' -v
      - name: Test calm Portuguese-Brazil narration and story-led scene sync
        run: python -m unittest discover -s tests -p 'test_calm_ptbr_story.py' -v
      - name: Test 5-to-15-minute long episodes without breaking Shorts
        run: python -m unittest discover -s tests -p 'test_long_duration_limit.py' -v
