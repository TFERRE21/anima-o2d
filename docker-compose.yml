services:
  anima2d:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-8000}:8000"
    environment:
      ANIMA_STORAGE: /data/jobs
      ANIMA_RENDER_ENGINE: blender
      BLENDER_BIN: blender
      PORT: 8000
    volumes:
      - anima2d_data:/data/jobs
    shm_size: "1gb"
    restart: unless-stopped

volumes:
  anima2d_data:
