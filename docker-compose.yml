services:
  anima2d:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${HOST_PORT:-5001}:5000"
    environment:
      ANIMA_STORAGE: /data/jobs
      ANIMA_RENDER_ENGINE: blender
      BLENDER_BIN: blender
      PORT: 5000
    volumes:
      - anima2d_data:/data/jobs
    shm_size: "1gb"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen(\u0027http://127.0.0.1:5000/api/health\u0027, timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

volumes:
  anima2d_data:
